<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Extracted 130-Frame Scroll Animation (High Definition)</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #080a0c;
      color: #f2f5f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #080a0c;
    }

    /* Sleek Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 87, 34, 0.5);
      border-radius: 4px;
    }

    /* Top Preload Progress Bar */
    .top-loader-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #ff5722, #ff9100, #d4ff32);
      box-shadow: 0 0 12px rgba(255, 87, 34, 0.9);
      z-index: 1000;
      pointer-events: none;
      transition: width 0.15s ease-out, opacity 0.5s ease 0.3s;
    }

    .top-loader-bar.done {
      opacity: 0;
    }

    /* HUD Bar at Top */
    .hud-controls {
      position: fixed;
      top: 1.25rem;
      left: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-badge {
      background: rgba(11, 14, 17, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 0.5rem 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
      pointer-events: auto;
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d4ff32;
      box-shadow: 0 0 10px #d4ff32;
    }

    .frame-counter {
      color: #9eaaa1;
      font-variant-numeric: tabular-nums;
      font-family: monospace;
    }

    /* Mode Toggle Button */
    .mode-toggle-btn {
      background: rgba(11, 14, 17, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 87, 34, 0.4);
      color: #f2f5f3;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
    }

    .mode-toggle-btn:hover {
      background: rgba(255, 87, 34, 0.2);
      border-color: #ff5722;
      transform: translateY(-1px);
    }

    /* Ambient Background Glow Layer */
    .ambient-glow-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 50% 50%, rgba(230, 81, 0, 0.15) 0%, transparent 70%),
        radial-gradient(circle at 50% 100%, rgba(11, 14, 17, 1) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Scroll Prompt */
    .scroll-prompt {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(11, 14, 17, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 0.55rem 1.35rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9eaaa1;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .mouse-icon {
      width: 14px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      position: relative;
    }

    .mouse-wheel {
      width: 3px;
      height: 5px;
      background: #ff5722;
      border-radius: 2px;
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      animation: wheelMove 1.4s infinite ease-in-out;
    }

    @keyframes wheelMove {
      0% { transform: translate(-50%, 0); opacity: 1; }
      100% { transform: translate(-50%, 8px); opacity: 0; }
    }

    /* Scroll Container: 480vh */
    .scroll-wrapper {
      position: relative;
      height: 480vh;
      width: 100%;
    }

    /* Sticky Canvas Viewport */
    .canvas-viewport {
      position: sticky;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #080a0c;
      transform: translateZ(0);
    }

    #sequence-canvas {
      display: block;
      pointer-events: none;
      /* Remove CSS object-fit to prevent browser double-scaling */
    }
  </style>
</head>
<body>
  <div id="loader-bar" class="top-loader-bar"></div>

  <div class="hud-controls">
    <div class="hud-badge">
      <div class="hud-dot"></div>
      <span>Start Running</span>
      <span class="frame-counter" id="frame-display">001 / 130</span>
    </div>

    <button type="button" class="mode-toggle-btn" id="mode-btn" title="Toggle between Native Sharp Fit and Full-Bleed Cover">
      <span id="mode-icon">✦</span>
      <span id="mode-text">View: Sharp Native (No Crop)</span>
    </button>
  </div>

  <div class="scroll-prompt" id="scroll-prompt">
    <div class="mouse-icon"><div class="mouse-wheel"></div></div>
    <span>Scroll to play transition</span>
  </div>

  <div id="scroll-wrapper" class="scroll-wrapper">
    <div class="canvas-viewport">
      <div class="ambient-glow-layer"></div>
      <canvas id="sequence-canvas"></canvas>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const TOTAL_FRAMES = 130;
      const LERP_FACTOR = 0.10;

      function getFrameSrc(index) {
        const frameNum = String(index + 1).padStart(4, '0');
        return `extracted_frames/frame_${frameNum}.jpg`;
      }

      // DOM Elements
      const canvas = document.getElementById('sequence-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const loaderBar = document.getElementById('loader-bar');
      const scrollWrapper = document.getElementById('scroll-wrapper');
      const frameDisplay = document.getElementById('frame-display');
      const scrollPrompt = document.getElementById('scroll-prompt');
      const modeBtn = document.getElementById('mode-btn');
      const modeText = document.getElementById('mode-text');

      // State Management
      const images = new Array(TOTAL_FRAMES);
      let loadedCount = 0;
      let targetIndex = 0;
      let currentIndex = 0;
      let lastDrawnIndex = -1;
      let lastDrawnWasExact = false;
      let isAllLoaded = false;
      
      // 'sharp' = pixel-perfect native 9:16 aspect ratio (zero pixel stretching)
      // 'cover' = full-bleed edge-to-edge
      let viewMode = 'sharp';

      modeBtn.addEventListener('click', () => {
        viewMode = viewMode === 'sharp' ? 'cover' : 'sharp';
        modeText.textContent = viewMode === 'sharp' 
          ? 'View: Sharp Native (No Crop)' 
          : 'View: Full-Bleed Cover';
        lastDrawnIndex = -1;
        renderFrame(Math.round(currentIndex));
      });

      function handleResize() {
        // High-DPI calibration (Retina 2x/3x crispness)
        const dpr = window.devicePixelRatio || 1;
        const displayWidth = window.innerWidth;
        const displayHeight = window.innerHeight;

        // Set explicit CSS display size
        canvas.style.width = `${displayWidth}px`;
        canvas.style.height = `${displayHeight}px`;

        // Set exact physical buffer resolution
        const targetWidth = Math.round(displayWidth * dpr);
        const targetHeight = Math.round(displayHeight * dpr);

        if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          lastDrawnIndex = -1;
        }

        // Enable high-quality bicubic interpolation
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
      }

      function getBestAvailableImage(idx) {
        if (images[idx] && images[idx].complete && images[idx].naturalWidth > 0) {
          return { img: images[idx], isExact: true, actualIndex: idx };
        }
        for (let offset = 1; offset < TOTAL_FRAMES; offset++) {
          const prev = idx - offset;
          if (prev >= 0 && images[prev]?.complete && images[prev]?.naturalWidth > 0) {
            return { img: images[prev], isExact: false, actualIndex: prev };
          }
          const next = idx + offset;
          if (next < TOTAL_FRAMES && images[next]?.complete && images[next]?.naturalWidth > 0) {
            return { img: images[next], isExact: false, actualIndex: next };
          }
        }
        return { img: null, isExact: false, actualIndex: -1 };
      }

      function renderFrame(index) {
        const { img, isExact, actualIndex } = getBestAvailableImage(index);
        if (!img) return;

        const cW = canvas.width;
        const cH = canvas.height;
        const iW = img.naturalWidth;
        const iH = img.naturalHeight;

        if (!iW || !iH) return;

        const dpr = window.devicePixelRatio || 1;

        // Ensure high-quality rendering context
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        ctx.fillStyle = '#080a0c';
        ctx.fillRect(0, 0, cW, cH);

        if (viewMode === 'sharp') {
          // SHARP NATIVE FIT: Never stretches beyond natural 9:16 proportions.
          // On mobile, fills screen. On desktop, shows full vertical athlete with zero pixel distortion.
          const scale = Math.min(cW / iW, cH / iH) * (window.innerWidth < 768 ? 1.0 : 0.94);
          const drawW = Math.round(iW * scale);
          const drawH = Math.round(iH * scale);
          const drawX = Math.round((cW - drawW) * 0.5);
          const drawY = Math.round((cH - drawH) * 0.5);

          // Subtle ambient glow behind runner
          ctx.save();
          const glow = ctx.createRadialGradient(cW * 0.5, cH * 0.5, 50 * dpr, cW * 0.5, cH * 0.5, drawW * 0.7);
          glow.addColorStop(0, 'rgba(230, 81, 0, 0.22)');
          glow.addColorStop(1, 'rgba(8, 10, 12, 0)');
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, cW, cH);
          ctx.restore();

          // Render image at razor-sharp bicubic scale
          ctx.drawImage(img, drawX, drawY, drawW, drawH);

          // Sleek glass framing on desktop
          if (window.innerWidth >= 768) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1 * dpr;
            ctx.strokeRect(drawX, drawY, drawW, drawH);
          }
        } else {
          // FULL-BLEED COVER: Fills 100% of widescreen
          const scale = Math.max(cW / iW, cH / iH);
          const drawW = Math.round(iW * scale);
          const drawH = Math.round(iH * scale);
          const drawX = Math.round((cW - drawW) * 0.5);
          const drawY = Math.round((cH - drawH) * 0.5);

          ctx.drawImage(img, drawX, drawY, drawW, drawH);
        }

        lastDrawnIndex = index;
        lastDrawnWasExact = isExact;

        // Update HUD
        const displayNum = String((actualIndex >= 0 ? actualIndex : index) + 1).padStart(3, '0');
        frameDisplay.textContent = `${displayNum} / 130`;
      }

      function preloadImages() {
        const firstImg = new Image();
        firstImg.src = getFrameSrc(0);
        images[0] = firstImg;

        firstImg.onload = () => {
          loadedCount++;
          handleResize();
          renderFrame(0);
          loadRemainingFrames();
        };

        firstImg.onerror = () => {
          console.error('Failed to load initial frame:', firstImg.src);
          loadRemainingFrames();
        };
      }

      function loadRemainingFrames() {
        const batchSize = 12;
        let nextIndex = 1;

        function loadBatch() {
          const limit = Math.min(nextIndex + batchSize, TOTAL_FRAMES);

          for (let i = nextIndex; i < limit; i++) {
            const img = new Image();
            img.src = getFrameSrc(i);

            img.onload = () => {
              loadedCount++;
              updateProgress();
            };

            img.onerror = () => {
              loadedCount++;
              updateProgress();
            };

            images[i] = img;
          }

          nextIndex = limit;

          if (nextIndex < TOTAL_FRAMES) {
            requestAnimationFrame(loadBatch);
          }
        }

        loadBatch();
      }

      function updateProgress() {
        const progress = (loadedCount / TOTAL_FRAMES) * 100;
        loaderBar.style.width = `${progress}%`;

        if (loadedCount >= TOTAL_FRAMES && !isAllLoaded) {
          isAllLoaded = true;
          loaderBar.classList.add('done');
        }
      }

      function onScroll() {
        const maxScroll = scrollWrapper.offsetHeight - window.innerHeight;
        const scrollY = Math.max(0, Math.min(window.scrollY, maxScroll));
        const progress = maxScroll > 0 ? scrollY / maxScroll : 0;

        targetIndex = Math.min(Math.floor(progress * TOTAL_FRAMES), TOTAL_FRAMES - 1);

        if (scrollY > 120 && scrollPrompt) {
          scrollPrompt.style.opacity = '0';
        } else if (scrollPrompt) {
          scrollPrompt.style.opacity = '1';
        }
      }

      function tick() {
        const delta = targetIndex - currentIndex;
        currentIndex += delta * LERP_FACTOR;

        const roundedIndex = Math.round(currentIndex);

        if (roundedIndex !== lastDrawnIndex || !lastDrawnWasExact) {
          renderFrame(roundedIndex);
        }

        requestAnimationFrame(tick);
      }

      // Event Listeners
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', () => {
        handleResize();
        lastDrawnIndex = -1;
      }, { passive: true });

      // Init
      handleResize();
      preloadImages();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
